name: CI Test Matrix

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-test-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: sqlite
            db_url: ""
            needs_iris: false
          - backend: iris
            db_url: iris://_SYSTEM:SYS@127.0.0.1:1972/USER
            needs_iris: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev --extra iris

      - name: Start IRIS container
        if: matrix.needs_iris
        run: docker run -d --name lomem-iris -p 1972:1972 intersystemsdc/iris-community:2025.3

      - name: Wait for IRIS port
        if: matrix.needs_iris
        shell: bash
        run: |
          for i in {1..40}; do
            if (echo > /dev/tcp/127.0.0.1/1972) >/dev/null 2>&1; then
              echo "IRIS is reachable on 127.0.0.1:1972"
              exit 0
            fi
            echo "Waiting for IRIS to start..."
            sleep 5
          done
          echo "IRIS did not become reachable in time."
          docker logs lomem-iris || true
          exit 1

      - name: Configure IRIS test password
        if: matrix.needs_iris
        run: |
          docker exec lomem-iris iris session IRIS -U %SYS \
            '##class(Security.Users).ChangePassword("_SYSTEM","SYS")'

      - name: Run backend tests
        env:
          LOMEM_DB_BACKEND: ${{ matrix.backend }}
          LOMEM_DB_URL: ${{ matrix.db_url }}
        run: |
          if [ "${{ matrix.backend }}" = "sqlite" ]; then
            uv run --extra dev pytest -q -k "not backend-iris"
          else
            uv run --extra dev pytest -q
          fi
