[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lomem"
version = "0.1.0"
description = "LoMem Phase 1 MVP prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4.0",
  "SQLAlchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]
iris = [
  "sqlalchemy-iris>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
